<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradientes Cobre Forjado -->
    <linearGradient id="copperLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5CBA7" />
      <stop offset="25%" stop-color="#E59866" />
      <stop offset="55%" stop-color="#CD7F32" />
      <stop offset="85%" stop-color="#B87333" />
      <stop offset="100%" stop-color="#873600" />
    </linearGradient>
    <linearGradient id="copperDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2303" />
      <stop offset="40%" stop-color="#6E2C00" />
      <stop offset="80%" stop-color="#873600" />
      <stop offset="100%" stop-color="#B87333" />
    </linearGradient>
    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#D5DBDB" />
      <stop offset="70%" stop-color="#85929E" />
      <stop offset="100%" stop-color="#34495E" />
    </linearGradient>
    <radialGradient id="copperAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CD7F32" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#873600" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="copperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Resplandor Cobre -->
  <circle cx="250" cy="250" r="240" fill="url(#copperAura)" />

  <!-- Fondo Circular Escudo Barber Vintage -->
  <circle cx="250" cy="250" r="225" fill="#0C0A09" stroke="url(#copperLight)" stroke-width="7" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="url(#copperDark)" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.85" />
  <circle cx="250" cy="250" r="202" fill="none" stroke="url(#copperLight)" stroke-width="1" opacity="0.4" />

  <!-- ANCLA COLOR COBRE (FONDO ESTRUCTURAL) -->
  <g id="copper-anchor" filter="url(#copperGlow)">
    <!-- Ojo / Grillete Superior del Ancla -->
    <circle cx="250" cy="90" r="26" fill="none" stroke="url(#copperLight)" stroke-width="12" />
    <circle cx="250" cy="90" r="14" fill="#0C0A09" stroke="url(#copperDark)" stroke-width="2" />
    <rect x="242" y="112" width="16" height="12" fill="url(#copperLight)" rx="2" />

    <!-- Eje / Caña vertical -->
    <path d="M239,122 L261,122 L261,385 L239,385 Z" fill="url(#copperLight)" stroke="url(#copperDark)" stroke-width="2" />
    <line x1="250" y1="124" x2="250" y2="383" stroke="#F5CBA7" stroke-width="2" opacity="0.8" />

    <!-- Barra Transversal (Cepo) -->
    <path d="M165,152 L335,152 L335,168 L165,168 Z" fill="url(#copperLight)" stroke="url(#copperDark)" stroke-width="2" rx="4" />
    <circle cx="165" cy="160" r="11" fill="url(#copperDark)" stroke="url(#copperLight)" stroke-width="3" />
    <circle cx="335" cy="160" r="11" fill="url(#copperDark)" stroke="url(#copperLight)" stroke-width="3" />

    <!-- Brazos Curvos Inferiores (Crown & Arms) -->
    <path d="M115,290 C125,405 375,405 385,290 C368,290 356,308 350,325 C330,388 170,388 150,325 C144,308 132,290 115,290 Z" fill="url(#copperLight)" stroke="url(#copperDark)" stroke-width="3" />

    <!-- Uñas / Puntas Triangulares de Ancla -->
    <polygon points="100,295 128,252 140,298" fill="url(#copperDark)" stroke="url(#copperLight)" stroke-width="3" />
    <polygon points="400,295 372,252 360,298" fill="url(#copperDark)" stroke="url(#copperLight)" stroke-width="3" />
    <circle cx="250" cy="385" r="12" fill="url(#copperLight)" stroke="url(#copperDark)" stroke-width="3" />
  </g>

  <!-- MÁQUINA DE CORTAR CABELLO / CLIPPER (CRUZADA AL CENTRO EN DIAGONAL) -->
  <g id="hair-clipper" transform="rotate(-26 250 255)">
    <!-- Sombra del Clipper -->
    <rect x="210" y="145" width="80" height="235" rx="20" fill="#000000" opacity="0.6" />

    <!-- Cable Flexible Inferior con protector -->
    <path d="M244,380 C244,420 262,430 250,455" fill="none" stroke="#1A252F" stroke-width="9" stroke-linecap="round" />
    <path d="M244,380 C244,420 262,430 250,455" fill="none" stroke="#34495E" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4" />
    <rect x="236" y="365" width="28" height="20" rx="4" fill="url(#copperDark)" stroke="url(#copperLight)" stroke-width="2" />

    <!-- Chasis / Cuerpo Ergonómico del Clipper en Cobre Forjado -->
    <path d="M222,160 L278,160 C284,200 288,280 286,340 C286,362 270,372 250,372 C230,372 214,362 214,340 C212,280 216,200 222,160 Z" fill="url(#copperLight)" stroke="#4A2303" stroke-width="3" />

    <!-- Tapa frontal facetada en tono cobre oscuro -->
    <path d="M230,192 L270,192 C274,230 276,290 274,325 C274,340 262,350 250,350 C238,350 226,340 226,325 C224,290 226,230 230,192 Z" fill="url(#copperDark)" stroke="url(#copperLight)" stroke-width="1.5" />

    <!-- Detalle de estrías de agarre antideslizante -->
    <line x1="234" y1="215" x2="266" y2="215" stroke="url(#copperLight)" stroke-width="2" opacity="0.7" />
    <line x1="234" y1="225" x2="266" y2="225" stroke="url(#copperLight)" stroke-width="2" opacity="0.7" />
    <line x1="234" y1="235" x2="266" y2="235" stroke="url(#copperLight)" stroke-width="2" opacity="0.7" />

    <!-- Switch / Botón Metálico On-Off -->
    <rect x="243" y="270" width="14" height="26" rx="4" fill="#17202A" stroke="url(#copperLight)" stroke-width="2" />
    <rect x="245" y="273" width="10" height="10" rx="2" fill="url(#steelBlade)" />

    <!-- Palanca Lateral de Graduación (Taper Lever) -->
    <path d="M214,195 L192,180 L198,212 L214,206 Z" fill="url(#steelBlade)" stroke="#1C2833" stroke-width="1.5" />
    <circle cx="214" cy="200" r="5" fill="url(#copperLight)" stroke="#4A2303" stroke-width="1.5" />

    <!-- Base de cuchilla y tornillos de ajuste -->
    <rect x="218" y="152" width="64" height="12" rx="2" fill="#2C3E50" stroke="url(#copperLight)" stroke-width="1" />
    <circle cx="228" cy="158" r="2.5" fill="url(#steelBlade)" />
    <circle cx="272" cy="158" r="2.5" fill="url(#steelBlade)" />

    <!-- Cuchilla Superior Dentada de Precisión (Steel Fade Blade) -->
    <rect x="215" y="132" width="70" height="22" rx="3" fill="url(#steelBlade)" stroke="#2C3E50" stroke-width="2" />
    <!-- Dientes afilados de corte -->
    <line x1="221" y1="132" x2="221" y2="144" stroke="#1A252F" stroke-width="2.5" />
    <line x1="227" y1="132" x2="227" y2="144" stroke="#1A252F" stroke-width="2.5" />
    <line x1="233" y1="132" x2="233" y2="144" stroke="#1A252F" stroke-width="2.5" />
    <line x1="239" y1="132" x2="239" y2="144" stroke="#1A252F" stroke-width="2.5" />
    <line x1="245" y1="132" x2="245" y2="144" stroke="#1A252F" stroke-width="2.5" />
    <line x1="250" y1="132" x2="250" y2="144" stroke="#1A252F" stroke-width="2.5" />
    <line x1="255" y1="132" x2="255" y2="144" stroke="#1A252F" stroke-width="2.5" />
    <line x1="261" y1="132" x2="261" y2="144" stroke="#1A252F" stroke-width="2.5" />
    <line x1="267" y1="132" x2="267" y2="144" stroke="#1A252F" stroke-width="2.5" />
    <line x1="273" y1="132" x2="273" y2="144" stroke="#1A252F" stroke-width="2.5" />
    <line x1="279" y1="132" x2="279" y2="144" stroke="#1A252F" stroke-width="2.5" />
  </g>

  <!-- LISTÓN / CINTA DE MARCA INFERIOR -->
  <g id="ribbon-banner">
    <!-- Puntas traseras del listón -->
    <polygon points="75,420 120,395 120,445" fill="#4A2303" stroke="url(#copperDark)" stroke-width="2" />
    <polygon points="425,420 380,395 380,445" fill="#4A2303" stroke="url(#copperDark)" stroke-width="2" />
    <!-- Cuerpo principal del listón -->
    <path d="M95,405 L130,388 L370,388 L405,405 L380,442 L120,442 Z" fill="url(#copperDark)" stroke="url(#copperLight)" stroke-width="3.5" />
    
    <!-- Tipografías de Marca -->
    <text x="250" y="422" text-anchor="middle" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-weight="900" font-size="21" fill="#FDFEFE" letter-spacing="4" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.9))">IRON &amp; ANCHOR</text>
    <text x="250" y="468" text-anchor="middle" font-family="'Bebas Neue', 'Arial Black', sans-serif" font-weight="bold" font-size="15" fill="url(#copperLight)" letter-spacing="7">BARBER CO.</text>
  </g>

  <!-- Estrellas y remaches decorativos -->
  <polygon points="250,52 254,62 265,62 256,69 259,79 250,73 241,79 244,69 235,62 246,62" fill="url(#copperLight)" />
  <circle cx="100" cy="250" r="4" fill="url(#copperLight)" />
  <circle cx="400" cy="250" r="4" fill="url(#copperLight)" />
</svg>
